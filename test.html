<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.125.0/Build/Cesium/Widgets/widgets.css" />
  <style>
    html, body, #cesiumContainer { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    #status { position:fixed; top:10px; left:10px; color:white; background:rgba(0,0,0,0.7); padding:8px 16px; border-radius:4px; font-family:monospace; z-index:1000; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="status">Loading...</div>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.125.0/Build/Cesium/Cesium.js"></script>
  <script>
    var statusEl = document.getElementById('status');
    
    function log(msg) {
      statusEl.textContent = msg;
      console.log(msg);
    }
    
    log('Cesium version: ' + Cesium.VERSION);
    
    try {
      Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwY2UxNmM3OS0xNzdkLTQzMTgtYjJlZC05MTA0MWVmYzMyYzIiLCJpZCI6NDQxMjk4LCJzdWIiOiJndW94dWFueXUiLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoiVW50aXRsZWQiLCJpYXQiOjE3ODA4MzEzMjR9.ruySHM-n61Ex4Zp31OKZtcFwQUvEEcsrOONGg6n2NiA';
      
      var viewer = new Cesium.Viewer('cesiumContainer', {
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        animation: false,
        timeline: false,
        fullscreenButton: false,
        vrButton: false,
        infoBox: false,
        selectionIndicator: false
      });
      
      log('Viewer created OK');
      
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(121.4998, 31.2397, 5000)
      });
      
      log('Camera set - ready!');
      
      viewer.scene.renderError.addEventListener(function(error) {
        log('RENDER ERROR: ' + error);
      });
      
    } catch(e) {
      log('ERROR: ' + e.message);
      console.error(e);
    }
  </script>
</body>
</html>
